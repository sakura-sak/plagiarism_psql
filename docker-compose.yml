# syntax=docker/dockerfile:1.4
# Standalone ML stack (Qdrant + analysis). Same optimized Dockerfile as root compose.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: antiplagiarism-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  analysis:
    image: antiplagiat-analysis:latest
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - antiplagiat-analysis:latest
    container_name: antiplagiarism-analysis
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: university_docs
      DEVICE: "${DEVICE:-cpu}"
      TORCH_CPU_THREADS: "${TORCH_CPU_THREADS:-}"
      AI_PERCENT_BOOST: "${AI_PERCENT_BOOST:-17.5}"
      ANALYSIS_API_KEY: "${ANALYSIS_API_KEY:-}"
    ports:
      - "8765:8765"

volumes:
  qdrant_storage:
